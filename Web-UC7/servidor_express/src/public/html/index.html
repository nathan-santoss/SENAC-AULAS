<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Jujutsu</title>

    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <header class="cabecalho">

        <div class="container-topo">

            <div class="logo-plataforma">
                <span class="logo-icone">IJ</span>
                <h1>Instituto Jujutsu</h1>
            </div>

            <nav class="menu-navegacao">
                <a href="/cursos">Cursos</a>
                <a href="/alunos">Alunos</a>
            </nav>

        </div>

    </header>

    <main class="conteudo-principal">

        <section class="secao-apresentacao">

            <div class="informacoes-apresentacao">

                <span class="etiqueta-plataforma">
                    Plataforma Acadêmica
                </span>

                <h2>
                    Gerencie cursos e alunos
                    com organização e praticidade
                </h2>

                <p>
                    Uma plataforma moderna para administração acadêmica,
                    matrículas e gerenciamento de cursos do Instituto Jujutsu.
                </p>

            </div>

            <div class="cartao-destaque">

                <div class="bloco-status">
                    <strong>0</strong>
                    <span>Cursos disponíveis</span>
                </div>

                <div class="bloco-status">
                    <strong>0</strong>
                    <span>Alunos cadastrados</span>
                </div>

                <div class="bloco-status">
                    <strong>0</strong>
                    <span>Turmas ativas</span>
                </div>

            </div>

        </section>

    </main>
    <script src="/src/public/renderer/index.js" defer></script>
</body>

</html>
